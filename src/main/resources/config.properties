# Varsayılan ayarlar. Komut satırından ezilebilir: mvn test -Dbrowser=firefox -Dheadless=true
baseUrl=https://www.saucedemo.com/
# chromium | firefox | webkit  (Playwright kendi tarayıcılarını indirir)
browser=chromium
headless=false
# Auto-wait için üst sınır (ms). Selenium projesindeki explicitWaitSeconds=10 ile aynı.
timeoutMs=10000
